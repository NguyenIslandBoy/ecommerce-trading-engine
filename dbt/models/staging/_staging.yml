version: 2

models:
  - name: stg_orders
    description: "Orders, cast, renamed, and channel derived deterministically from referring_site. Filtered to rows available as of var('as_of_date')."
    columns:
      - name: order_id
        description: "Shopify order id. Primary key."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "FK to stg_customers. Never null in this dataset."
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]
      - name: channel
        description: "Last-click channel derived from referring_site."
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'tiktok', 'unattributed']
      - name: is_cancelled
        data_tests: [not_null]

  - name: stg_order_lines
    description: "Order line items. Availability inherited from the parent order."
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: variant_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: variant_id
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

  - name: stg_customers
    description: "Customer profiles. NOTE source_order_count includes cancelled orders."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: has_valid_email
        description: "False for the 623 customers with a blank email string."
        data_tests: [not_null]
      - name: email_consent_state
        data_tests:
          - accepted_values:
              arguments:
                values: ['subscribed', 'not_subscribed']

  - name: stg_products
    description: "Product catalogue at variant grain."
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
      - name: unit_cost
        data_tests: [not_null]
      - name: margin_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: stg_ads_daily
    description: "Meta and Google daily spend unioned to one grain. Meta reports NO conversions."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, campaign_id, ad_date]
    columns:
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google']
      - name: spend
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: ad_date
        data_tests: [not_null]

  - name: stg_email_flows
    description: "Klaviyo flow engagement. WEEKLY grain - do not join to daily facts without dim_date.week_start."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [flow_id, message_id, week_start]
    columns:
      - name: recipients
        data_tests: [not_null]
      - name: week_start
        data_tests: [not_null]

  # ---- Finance (SYNTHETIC inputs) -----------------------------------------

  - name: stg_marketing_budget
    description: "SYNTHETIC approved budgets. A version is visible from its approved_on date."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [budget_month, channel, budget_version]
    columns:
      - name: budget_id
        data_tests: [unique, not_null]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'tiktok']
      - name: budget_version
        data_tests:
          - accepted_values:
              arguments:
                values: ['original', 'revised']
      - name: pacing_profile
        data_tests:
          - accepted_values:
              arguments:
                values: ['linear', 'front_loaded']
      - name: approved_amount
        data_tests: [not_null]
      - name: approved_on
        data_tests: [not_null]

  - name: stg_vendor_invoice_lines
    description: "SYNTHETIC invoice lines. A line is visible from its received_date."
    columns:
      - name: invoice_line_id
        data_tests: [unique, not_null]
      - name: billed_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'agency']
      - name: cost_type
        description: "media for platform lines (comparable to delivered spend), fee for agency lines."
        data_tests:
          - accepted_values:
              arguments:
                values: ['media', 'fee']
      - name: amount
        data_tests: [not_null]
      - name: service_month
        data_tests: [not_null]

  - name: stg_invoice_line_allocations
    description: "SYNTHETIC allocation of invoice lines to channels. Visibility follows the line, applied in fct_invoice_allocated."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invoice_line_id, channel]
    columns:
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'tiktok']
      - name: allocation_pct
        data_tests: [not_null]
