version: 2

sources:
  - name: finance
    description: >
      SYNTHETIC Finance inputs generated by scripts/generate_finance_inputs.py
      (seed 20240701). Not company data; vendors are placeholders. Read in place
      by DuckDB, exactly like the raw ad and order extracts.
    meta:
      external_location: "read_csv_auto('{{ var('data_dir') }}/finance/{name}.csv')"
    tables:
      - name: marketing_budget
        description: "Approved monthly budgets by channel, original and revised versions. 37 rows."
      - name: vendor_invoice_lines
        description: "Invoice lines with one-calendar-month service periods. 37 rows."
      - name: invoice_line_allocations
        description: "Allocation of invoice lines to channels. 48 rows; one line deliberately has none."
