version: 2

models:
  - name: dim_date
    description: "Date spine from the first order date through var('as_of_date')."
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: is_peak_season
        description: "November and December, the observed demand peak."
        data_tests: [not_null]

  - name: dim_campaign
    description: "One row per platform campaign, with funnel stage parsed from the name."
    columns:
      - name: campaign_key
        data_tests: [unique, not_null]
      - name: funnel_stage
        data_tests:
          - accepted_values:
              arguments:
                values: ['prospecting', 'retargeting', 'catalogue', 'brand', 'non_brand', 'shopping', 'pmax', 'other']

  - name: dim_customer
    description: "One row per customer. Acquisition channel is the channel of their FIRST NON-CANCELLED order."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: acquisition_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'tiktok', 'unattributed']
      - name: is_marketable
        description: "Has a valid email AND has consented. Excludes the 623 blank-email records."
        data_tests: [not_null]

  - name: dim_product
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
      - name: margin_pct
        data_tests: [not_null]

  - name: fct_order
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_order_line
    description: "Line grain with COGS and contribution margin. All downstream value metrics are margin-based."
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: variant_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: variant_id
      - name: contribution_margin
        data_tests: [not_null]

  - name: fct_ad_spend_daily
    description: "Daily campaign spend with derived efficiency metrics. CPC = CPM / (1000 * CTR)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [campaign_key, ad_date]
    columns:
      - name: campaign_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key
      - name: ad_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_email_flow_weekly
    description: "Weekly flow engagement with derived rates."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [flow_id, message_id, week_start]
    columns:
      - name: open_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: fct_invoice_allocated
    description: >
      SYNTHETIC inputs. Invoice line x channel. Each row is ROUND(amount *
      allocation_pct, 2); the last row of a line takes the remainder so the
      rows sum to the line amount to the penny. A line with no allocation rows
      becomes one 'unallocated' row and is never dropped.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invoice_line_id, channel]
    columns:
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'tiktok', 'unallocated']
      - name: allocation_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['allocated', 'unallocated']
      - name: allocated_amount
        data_tests: [not_null]

  - name: fct_marketing_cost_monthly
    description: >
      SYNTHETIC Finance inputs against delivered spend. Month x channel, the
      single source of truth for delivered, invoiced, accrual and recognised
      cost. Accrual rule, first match wins: once the final full-month
      platform invoice is received (is_media_final), the invoice replaces the
      estimate (accrual 0, recognised_media_expense = media_invoiced; the
      true-up). Before that, where delivered spend is known,
      estimated_unbilled_accrual = MAX(delivered_spend - media_invoiced, 0)
      and recognised_media_expense = GREATEST(delivered_spend,
      media_invoiced). Where delivered spend is NULL, accrual is NULL and
      recognised expense is what has been invoiced, else NULL.
      recognised_expense = recognised_media_expense + fee_invoiced. Only
      delivered-but-unbilled media is accrued; fees are recognised on
      receipt. No GL: the true-up restates figures, it posts no journals.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_start, channel]
    columns:
      - name: month_start
        data_tests: [not_null]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'tiktok', 'unallocated']
      - name: delivered_spend
        description: "NULL, never 0, where the channel has no cost source or no day is visible yet."
      - name: invoiced_amount
        data_tests: [not_null]
      - name: is_media_final
        description: "A platform media invoice covering the whole service month has been received; the invoice then replaces the estimate."
        data_tests: [not_null]
      - name: data_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['complete', 'partial_month', 'source_gap', 'no_cost_source', 'unallocated']
