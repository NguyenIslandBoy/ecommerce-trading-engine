version: 2

models:
  - name: dim_date
    description: "Date spine from the first order date through var('as_of_date')."
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: is_peak_season
        description: "November and December, the observed demand peak."
        data_tests: [not_null]

  - name: dim_campaign
    description: "One row per platform campaign, with funnel stage parsed from the name."
    columns:
      - name: campaign_key
        data_tests: [unique, not_null]
      - name: funnel_stage
        data_tests:
          - accepted_values:
              arguments:
                values: ['prospecting', 'retargeting', 'catalogue', 'brand', 'non_brand', 'shopping', 'pmax', 'other']

  - name: dim_customer
    description: "One row per customer. Acquisition channel is the channel of their FIRST NON-CANCELLED order."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: acquisition_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['meta', 'google', 'tiktok', 'unattributed']
      - name: is_marketable
        description: "Has a valid email AND has consented. Excludes the 623 blank-email records."
        data_tests: [not_null]

  - name: dim_product
    columns:
      - name: variant_id
        data_tests: [unique, not_null]
      - name: margin_pct
        data_tests: [not_null]

  - name: fct_order
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_order_line
    description: "Line grain with COGS and contribution margin. All downstream value metrics are margin-based."
    columns:
      - name: order_line_id
        data_tests: [unique, not_null]
      - name: variant_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: variant_id
      - name: contribution_margin
        data_tests: [not_null]

  - name: fct_ad_spend_daily
    description: "Daily campaign spend with derived efficiency metrics. CPC = CPM / (1000 * CTR)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [campaign_key, ad_date]
    columns:
      - name: campaign_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_key
      - name: ad_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_email_flow_weekly
    description: "Weekly flow engagement with derived rates."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [flow_id, message_id, week_start]
    columns:
      - name: open_rate
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
